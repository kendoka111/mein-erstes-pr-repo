# Balkonheizung: Moduswahl (26.09.2026)
#
# Hintergrund: Erste Dashboard-Umsetzung (zwei getrennte Kacheln fuer
# switch.mystrom_device und input_boolean.balkonheizung_automatik_aktiv)
# war nicht das, was Normen wollte - er wollte einen einzelnen Umschalter
# mit drei Zustaenden ("Panel aus", "Panel an", "Automatisch"), keine zwei
# Boxen nebeneinander. Umgesetzt als input_select mit denselben
# Auswahl-Buttons wie die bereits bestehende "Akku-Modus"-Kachel
# (input_select.zendure_operation_mode, gleiches Kartenmuster:
# type: tile, features: [select-options], grid_options columns: 12).
#
# input_select.balkonheizung_modus (Optionen: "Aus", "An", "Automatisch")
# ist die einzige Bedienoberflaeche. Diese Automatisierung bildet die
# Auswahl auf die beiden tatsaechlichen Steuer-Entities ab:
# - input_boolean.balkonheizung_automatik_aktiv (Vorrang-Schalter der
#   Ueberschuss-Automatisierung automation.balkonheizung_pv_uberschuss)
# - switch.mystrom_device (das Panel selbst)
#
# "Aus"/"An": Automatik wird deaktiviert, Panel manuell fest auf aus/an
# gesetzt. "Automatisch": Automatik wird aktiviert, das Panel wird ab dann
# von automation.balkonheizung_pv_uberschuss anhand der Netzeinspeisung
# gesteuert (siehe balkon_heizung_ueberschuss.yaml) - kann je nach
# aktuellem Zustand bis zu 5 Minuten dauern (naechster Resync-Tick dort),
# bewusst in Kauf genommen, siehe Kommentare in balkon_heizung_ueberschuss.yaml.
#
# Bewusst keine Rueck-Synchronisation: wird switch.mystrom_device oder
# input_boolean.balkonheizung_automatik_aktiv direkt (z. B. per App oder
# Sprachbefehl) statt ueber den Modus-Schalter geaendert, zieht
# input_select.balkonheizung_modus NICHT automatisch nach. Einfachheit vor
# Vollstaendigkeit - der Modus-Schalter ist die vorgesehene Bedienoberflaeche.
#
# Kein Debounce/Race-Risiko wie bei balkon_heizung_ueberschuss.yaml: hier
# steuert ausschliesslich ein bewusster, seltener Nutzer-Klick, keine
# rauschende Sensor-Schwelle - daher ohne Dr.-Schmidt-Mehrfachrunde
# umgesetzt, nur einmalig gegengeprueft.

- id: balkon_heizung_moduswahl
  alias: "Balkonheizung: Moduswahl (Aus/An/Automatisch)"
  description: >
    Bildet input_select.balkonheizung_modus auf die beiden eigentlichen
    Steuer-Entities ab: input_boolean.balkonheizung_automatik_aktiv
    (Vorrang-Schalter der Überschuss-Automatisierung) und
    switch.mystrom_device (das Panel selbst). 'Aus' und 'An' schalten die
    Automatik ab und setzen das Panel manuell fest; 'Automatisch'
    aktiviert die Automatik wieder - automation.balkonheizung_pv_uberschuss
    übernimmt danach die Steuerung des Panels anhand der Netzeinspeisung.
    Keine Rück-Synchronisation in die andere Richtung (bewusst einfach
    gehalten): wer das Panel oder die Automatik direkt umschaltet, muss
    den Modus-Schalter separat nachziehen.
  triggers:
    - trigger: state
      entity_id:
        - input_select.balkonheizung_modus
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.balkonheizung_modus
              state: "Aus"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.balkonheizung_automatik_aktiv
            - action: switch.turn_off
              target:
                entity_id: switch.mystrom_device
        - conditions:
            - condition: state
              entity_id: input_select.balkonheizung_modus
              state: "An"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.balkonheizung_automatik_aktiv
            - action: switch.turn_on
              target:
                entity_id: switch.mystrom_device
        - conditions:
            - condition: state
              entity_id: input_select.balkonheizung_modus
              state: "Automatisch"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.balkonheizung_automatik_aktiv
      default: []
  mode: single
  max_exceeded: silent
