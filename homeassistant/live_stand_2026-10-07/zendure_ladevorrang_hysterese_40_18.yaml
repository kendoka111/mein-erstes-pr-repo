# Live-Stand automation.zendure_ladevorrang_hysterese_40_18, gelesen 07.10.2026, config_hash de58a573927a3f65
# Exakte Kopie der Live-Konfiguration (Sicherungspunkt vor der Verschlankung).
- id: zendure_ladevorrang_hysterese
  alias: Zendure Ladevorrang (Hysterese 40 % / 18 %)
  description: |-
    Ladevorrang mit Hysterese fuer den Zendure-Speicher. Faellt der Ladestand auf 18 %, wird von "Smart Matching" auf "Smart Charge Only" umgeschaltet: die Entladung ist gesperrt, der Akku laedt aus PV-Ueberschuss. Ab 40 % wird auf "Smart Matching" zurueckgeschaltet und der Speicher versorgt wieder das Haus, bis er erneut bei 18 % steht.
    Faellt der SOC unter die Mindest-SOC von 18 %, laedt das Paket auch im gesperrten Zustand "Smart Charge Only" mit 1200 W aus dem Netz nach. Das ist Verhalten des Pakets, nicht dieser Automation, und bleibt bewusst unangetastet.
    Der Zustand des Automaten liegt ausschliesslich im input_select - es gibt bewusst keinen Merker-Helper und keinen Hauptschalter, die Regelung laeuft ohne Eingriff.
    Gewolltes Verhalten an truebe Tagen: wird 40 % nicht erreicht, bleibt der Speicher gesperrt und sammelt still ein, bis er die Schwelle am naechsten Tag schafft. Das kostet wenig, da er bei 18 % ohnehin nichts Nutzbares vorhaelt, und spart die Rundlaufverluste des Pendelns.
    Steht der Modus auf einem dritten Wert (Quick Charge, Standby, Dynamic Trading ...), greift kein Zweig und die Automation haelt still. Umgekehrt wird eine manuelle Wahl innerhalb der beiden Automatik-Modi zurueckgezogen: wer oberhalb 40 % von Hand "Smart Charge Only" waehlt, wird auf "Smart Matching" zurueckgesetzt.
    Nicht abgedeckt: Die Hysterese wirkt ausschliesslich zwischen "Smart Matching" und "Smart Charge Only". In allen uebrigen Modi - unter anderem Manual, Quick Discharge, Smart Discharge Only, Dynamic Smart Matching und Dynamic Trading + Smart Matching - haelt die Automation still, dort greift bei 18 % kein Schutz durch diese Automation.
  triggers:
  - above: 39
    entity_id: sensor.zendure_total_state_of_charge
    id: freigeben
    note: above ist exklusiv, der Sensor liefert ganze Prozent - 39 feuert also ab 40 %. Trotz des Alias "40 %" ist 39 hier der korrekte Wert.
    trigger: numeric_state
  - below: 19
    entity_id: sensor.zendure_total_state_of_charge
    id: sperren
    note: 'below ist exklusiv - feuert ab 18 %. Das Paket beendet die aktive Entladung an der Mindest-SOC (der Entladezweig ist auf total_soc > min_soc gegattert) - genau daher das Pendeln. Der SOC sinkt durch Eigenverbrauch und Standby-Verluste trotzdem auf 17 %, belegt in drei aufeinanderfolgenden Naechten (27., 28. und 29.08.); der Schutzzweig holt ihn dann aus dem Netz zurueck. Fuer diesen Trigger ohne Belang: die Flanke 19 -> 18 hat da bereits gefeuert, ein weiteres Absinken erzeugt keine neue - der Zeit-Resync greift ohnehin zustandsbasiert.'
    trigger: numeric_state
  - entity_id: input_select.zendure_operation_mode
    id: resync
    note: 'Schliesst die Reaktionsluecke bei einem Moduswechsel von aussen. Kein Rueckkopplungsrisiko: nach einer eigenen Umschaltung findet der Lauf den jeweils anderen Modus vor, damit ist keine Bedingung mehr erfuellt und der Lauf endet ohne Aktion.'
    trigger: state
  - event: start
    id: resync
    note: Ein numeric_state-Trigger ist nach dem Start nicht scharf, wenn der Wert die Schwelle bereits erfuellt. Wirkt in der Praxis selten, weil der SOC-Sensor beim Start meist noch unavailable ist - dann faengt es der Zeittakt ab. Kostet nichts, deshalb drin.
    trigger: homeassistant
  - id: resync
    minutes: /10
    note: Netz gegen verpasste Flanken (Sensor unavailable, Reload, HA waehrend des Uebergangs aus). Rund 144 Leerlaeufe pro Tag, rechnerisch vernachlaessigbar. stored_traces steht auf 256 und deckt damit rund 1,7 Tage ab, sodass die echten Umschaltungen zwischen den Leerlaeufen im Trace-Ringpuffer auffindbar bleiben.
    trigger: time_pattern
  actions:
  - choose:
    - alias: Entladung freigeben (SOC >= 40 %)
      conditions:
      - above: 39
        condition: numeric_state
        entity_id: sensor.zendure_total_state_of_charge
      - condition: state
        entity_id: input_select.zendure_operation_mode
        note: 'Waechter: nur aus dem automationseigenen Sperrzustand heraus freigeben. Dritte Modi bleiben unangetastet.'
        state: Smart Charge Only
      sequence:
      - action: input_select.select_option
        data:
          option: Smart Matching
        target:
          entity_id: input_select.zendure_operation_mode
    - alias: Ladevorrang - Entladung sperren (SOC <= 18 %)
      conditions:
      - below: 19
        condition: numeric_state
        entity_id: sensor.zendure_total_state_of_charge
      - condition: state
        entity_id: input_select.zendure_operation_mode
        note: Waechter wie oben. Diese Richtung ist der Tiefentladeschutz.
        state: Smart Matching
      sequence:
      - action: input_select.select_option
        data:
          option: Smart Charge Only
        target:
          entity_id: input_select.zendure_operation_mode
    note: |-
      Bewusst zustands- statt flankenbasiert: entschieden wird ueber den Ist-Zustand, nicht ueber condition: trigger. Nur so koennen Start-, Modus- und Zeit-Resync dieselben Zweige benutzen. Die Trigger-IDs bleiben fuer die Trace-Lesbarkeit erhalten.
      Kein default-Zweig: Stillhalten ist der gewollte Normalfall. Im Totband 19-39 % sind beide Modi zulaessig, dort wird nichts geaendert.
      Faellt der SOC-Sensor auf unavailable, sind beide numeric_state- Bedingungen false und der Lauf endet folgenlos - in beide Richtungen die sichere Seite.
  max_exceeded: silent
  mode: single
  trace:
    stored_traces: 256
